<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selia — Gouvernance IA</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/ai_governance.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar"><div data-app-nav></div></aside>
    <div class="main-wrapper">
      <header class="topbar"></header>
      <main class="content-wrapper" id="main">
        <div class="page-header"><div class="page-title-group"><h1>Gouvernance IA</h1><p>Passerelle de modèles, base de connaissances (RAG) et évaluations hors ligne.</p></div><div class="page-actions"><button type="button" class="btn btn-outline" id="btnEval" data-icon="target">Lancer les évaluations</button><button type="button" class="btn btn-primary" id="btnDoc" data-icon="plus">Ajouter un document</button></div></div><section class="kpi-grid kpi-grid--compact" id="kpis" aria-label="Indicateurs"><p class="data-state" role="status">Chargement…</p></section><section class="card sub-card" id="evalCard" hidden><div class="card-header"><h2 class="card-title">Résultat des évaluations</h2><span class="card-subtitle" id="evalWhen"></span></div><div id="evalBody"></div></section><section class="card list-card sub-card"><div class="card-header"><h2 class="card-title">Base de connaissances</h2></div>
          <div class="table-responsive"><table class="data-table responsive-table"><thead><tr><th>Document</th><th>Source</th><th>Accès</th><th class="num">Segments</th><th>Ajouté</th><th>Statut</th></tr></thead>
          <tbody id="docRows"><tr><td colspan="6" class="data-state">Chargement…</td></tr></tbody></table></div></section><div class="modal-backdrop" id="docModal" hidden>
          <form class="modal" id="docForm" novalidate aria-labelledby="docTitle">
            <h2 id="docTitle">Ajouter un document</h2>
            <div class="form-grid">
              <div class="field span-2"><label for="dTitle">Titre *</label><input class="form-control" id="dTitle" required maxlength="255"></div>
              <div class="field"><label for="dSource">Type de source</label><select class="form-control" id="dSource"><option value="POLICY">Politique</option><option value="FAQ">FAQ</option><option value="PRODUCT_SHEET">Fiche produit</option><option value="PROCEDURE">Procédure</option></select></div>
              <div class="field"><label for="dAcl">Visible par</label><select class="form-control" id="dAcl"><option value="public">Tout le monde (y compris clients)</option><option value="internal">Équipe interne uniquement</option></select></div>
              <div class="field span-2"><label for="dContent">Contenu *</label><textarea class="form-control" id="dContent" rows="6" required></textarea></div>
            </div>
            <p class="form-error" role="alert"></p>
            <div class="modal-actions"><button type="button" class="btn btn-outline" data-close-modal>Annuler</button><button type="submit" class="btn btn-primary">Indexer</button></div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="js/app_shell.js"></script>
  <script src="js/list_page.js"></script>
  <script src="js/pages/ai_governance.js"></script>
</body>
</html>
