<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Checkout & Payment Sandbox — Sales AI Platform</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/checkout.css">
  <script src="js/pages/checkout.handlers.js" defer></script>
</head>
<body data-demo-page>
  <div class="app-container">
    <!-- MASTER SIDEBAR -->
    <aside class="sidebar"><div data-app-nav></div></aside>

    <div class="main-wrapper">
      <header class="topbar">
        <button class="mobile-menu-btn" id="mobileMenuToggle">☰</button>
        <div class="search-container">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="globalSearchInput" placeholder="Rechercher des clients, devis, commandes, agents...">
          <span class="search-shortcut">Ctrl + K</span>
        </div>

        <div class="topbar-actions">
          <div class="tenant-selector-pill" id="tenantSelectorPill">
            <span>🏢</span> <span id="currentTenantLabel"></span>
          </div>

          <div class="icon-btn-badge" id="notifBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          </div>

          <button class="btn-header-primary" id="btnQuickNew">
            <span>+</span> Nouveau
          </button>

          <div class="user-topbar-pill">
            <div class="user-avatar" style="width:34px; height:34px; background:#082C22; color:#FFFFFF; border:2px solid #10B981;"></div>
            <div style="display:flex; flex-direction:column; line-height:1.2;">
              <span style="font-weight:600; font-size:13px; color:#17251F;"></span>
              <span style="font-size:11px; color:#66756D;"></span>
            </div>
          </div>
        </div>
      </header>

      <main class="content-wrapper">
<div class="timer-banner">
        <span>🔒 <strong>Stock Reservation Active:</strong> Your inventory holds are guaranteed during checkout.</span>
        <span class="timer-count" id="countdown">29:59</span>
      </div>

      <div class="card">
        <div class="card-title">1. Commercial Order Details</div>
        <div class="form-group">
          <label class="form-label">Order Number or Accepted Quote Reference</label>
          <input type="text" id="order-ref" class="form-control" placeholder="ORD-202611-XXXXXX or QUOTE-202611-XXXXXX">
        </div>

        <div class="breakdown-card">
          <div class="breakdown-row"><span>Items Subtotal:</span> <strong id="subtotal-display">$1,200.00</strong></div>
          <div class="breakdown-row"><span>Commercial Discount:</span> <span style="color: var(--status-success);" id="discount-display">-$120.00</span></div>
          <div class="breakdown-row"><span>Itemized Tax (VAT 20%):</span> <span id="tax-display">$216.00</span></div>
          <div class="breakdown-row breakdown-total"><span>Authoritative Grand Total:</span> <span id="total-display">$1,296.00 USD</span>
      </main>
    </div>
  </div>


  <script src="js/app_shell.js"></script>
  <script src="js/pages/checkout.js"></script>

</body>
<!-- csp-build: migrated -->
</html>
