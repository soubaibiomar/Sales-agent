<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selia — Support & SAV</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/support.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar"><div data-app-nav></div></aside>
    <div class="main-wrapper">
      <header class="topbar"></header>
      <main class="content-wrapper" id="main">
        <div class="page-header">
          <div class="page-title-group"><h1>Support & SAV</h1><p>Traitez les demandes clients et les retours.</p></div>
          <div class="page-actions"><button type="button" class="btn btn-primary" id="btnNew" data-icon="plus">Nouveau ticket</button></div>
        </div>
        <section class="kpi-grid kpi-grid--compact" id="kpis" aria-label="Indicateurs"></section>
        <section class="card list-card">
          <div class="list-toolbar">
            <div class="chip-row" role="group" aria-label="Filtrer" id="chips"></div>
            <div class="toolbar-right">
              <label class="search-inline"><span class="visually-hidden">Rechercher</span><input type="search" class="form-control" id="search" placeholder="Rechercher un ticket, un client…"></label>
              <select class="select-pill" id="yearSelect" aria-label="Période"><option value="year" selected>Cette année</option><option value="all">Toutes les dates</option></select>
            </div>
          </div>
          <div class="table-responsive">
            <table class="data-table responsive-table">
              <thead><tr><th>N° ticket</th><th>Sujet</th><th>Client</th><th>Priorité</th><th>Créé le</th><th>Statut</th></tr></thead>
              <tbody id="rows"><tr><td colspan="6" class="data-state" role="status">Chargement…</td></tr></tbody>
            </table>
          </div>
          <nav class="pager" id="pager" aria-label="Pagination"></nav>
        </section>
        <section class="card sub-card list-card"><div class="card-header"><h2 class="card-title">Retours (RMA)</h2></div>
          <div class="table-responsive"><table class="data-table responsive-table"><thead><tr><th>N° retour</th><th>Motif</th><th>Action demandée</th><th class="num">Remboursement (MAD)</th><th>Statut</th></tr></thead>
          <tbody id="rmaRows"><tr><td colspan="5" class="data-state">Chargement…</td></tr></tbody></table></div></section>

        <div class="modal-backdrop" id="newModal" hidden>
          <form class="modal" id="newModalForm" novalidate aria-labelledby="newModalTitle">
            <h2 id="newModalTitle">Nouveau ticket</h2>
            <div class="form-grid"><div class="field span-2"><label for="tSubject">Sujet *</label><input class="form-control" id="tSubject" type="text" maxlength="255" required></div><div class="field"><label for="tAccount">Client</label><select class="form-control" id="tAccount"><option value="">Sans client</option></select></div><div class="field"><label for="tPriority">Priorité</label><select class="form-control" id="tPriority"><option value="MEDIUM">Moyenne</option><option value="LOW">Basse</option><option value="HIGH">Haute</option><option value="URGENT">Urgente</option></select></div><div class="field span-2"><label for="tCategory">Catégorie</label><select class="form-control" id="tCategory"><option value="GENERAL">Général</option><option value="DELIVERY">Livraison</option><option value="BILLING">Facturation</option><option value="PRODUCT">Produit</option><option value="WARRANTY">Garantie</option></select></div><div class="field span-2"><label for="tDesc">Description *</label><textarea class="form-control" id="tDesc" rows="3" required></textarea></div></div>
            <p class="form-error" role="alert"></p>
            <div class="modal-actions"><button type="button" class="btn btn-outline" data-close-modal>Annuler</button><button type="submit" class="btn btn-primary">Créer le ticket</button></div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="js/app_shell.js"></script>
  <script src="js/list_page.js"></script>
  <script src="js/pages/support.js"></script>
</body>
</html>
