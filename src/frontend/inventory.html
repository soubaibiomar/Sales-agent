<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selia — Stock & entrepôts</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/inventory.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar"><div data-app-nav></div></aside>
    <div class="main-wrapper">
      <header class="topbar"></header>
      <main class="content-wrapper" id="main">
        <div class="page-header">
          <div class="page-title-group"><h1>Stock & entrepôts</h1><p>Suivez les niveaux de stock disponibles par entrepôt.</p></div>
          <div class="page-actions"><button type="button" class="btn btn-primary" id="btnNew" data-icon="plus">Nouvel article</button><button type="button" class="btn btn-outline" id="btnNewWh" data-icon="plus">Nouvel entrepôt</button></div>
        </div>
        <section class="kpi-grid kpi-grid--compact" id="kpis" aria-label="Indicateurs"></section>
        <section class="card list-card">
          <div class="list-toolbar">
            <div class="chip-row" role="group" aria-label="Filtrer" id="chips"></div>
            <div class="toolbar-right">
              <label class="search-inline"><span class="visually-hidden">Rechercher</span><input type="search" class="form-control" id="search" placeholder="Rechercher un SKU, un entrepôt…"></label>

            </div>
          </div>
          <div class="table-responsive">
            <table class="data-table responsive-table">
              <thead><tr><th>SKU</th><th>Entrepôt</th><th class="num">En stock</th><th class="num">Réservé</th><th class="num">Disponible</th><th>Statut</th></tr></thead>
              <tbody id="rows"><tr><td colspan="6" class="data-state" role="status">Chargement…</td></tr></tbody>
            </table>
          </div>
          <nav class="pager" id="pager" aria-label="Pagination"></nav>
        </section>


        <div class="modal-backdrop" id="newModal" hidden>
          <form class="modal" id="newModalForm" novalidate aria-labelledby="newModalTitle">
            <h2 id="newModalTitle">Nouvel article de stock</h2>
            <div class="form-grid"><div class="field span-2"><label for="iWh">Entrepôt *</label><select class="form-control" id="iWh"><option value="">Choisir un entrepôt…</option></select></div><div class="field"><label for="iSku">SKU *</label><input class="form-control" id="iSku" type="text" maxlength="100" required></div><div class="field"><label for="iQty">Quantité initiale</label><input class="form-control" id="iQty" type="number" min="0" value="0"></div></div>
            <p class="form-error" role="alert"></p>
            <div class="modal-actions"><button type="button" class="btn btn-outline" data-close-modal>Annuler</button><button type="submit" class="btn btn-primary">Créer l'article</button></div>
          </form>
        </div>
        <div class="modal-backdrop" id="whModal" hidden>
          <form class="modal" id="whModalForm" novalidate aria-labelledby="whModalTitle">
            <h2 id="whModalTitle">Nouvel entrepôt</h2>
            <div class="form-grid"><div class="field"><label for="wCode">Code *</label><input class="form-control" id="wCode" type="text" maxlength="50" required></div><div class="field"><label for="wName">Nom *</label><input class="form-control" id="wName" type="text" maxlength="255" required></div><div class="field span-2"><label for="wCity">Ville</label><input class="form-control" id="wCity" type="text" ></div></div>
            <p class="form-error" role="alert"></p>
            <div class="modal-actions"><button type="button" class="btn btn-outline" data-close-modal>Annuler</button><button type="submit" class="btn btn-primary">Créer l'entrepôt</button></div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="js/app_shell.js"></script>
  <script src="js/list_page.js"></script>
  <script src="js/pages/inventory.js"></script>
</body>
</html>
