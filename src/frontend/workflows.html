<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selia — Workflows</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/workflows.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar"><div data-app-nav></div></aside>
    <div class="main-wrapper">
      <header class="topbar"></header>
      <main class="content-wrapper" id="main">
        <div class="page-header">
          <div class="page-title-group"><h1>Workflows</h1><p>Suivez les traitements durables (commandes, paiements, relances) et leurs reprises.</p></div>
          <div class="page-actions"><button type="button" class="btn btn-outline" id="btnResume" data-icon="arrow">Relancer les workflows bloqués</button></div>
        </div>
        <section class="kpi-grid kpi-grid--compact" id="kpis" aria-label="Indicateurs"></section><section class="card list-card">

          <div class="list-toolbar">
            <div class="chip-row" role="group" aria-label="Filtrer" id="chips"></div>
            <div class="toolbar-right"><label class="search-inline"><span class="visually-hidden">Rechercher</span><input type="search" class="form-control" id="search" placeholder="Rechercher un workflow…"></label><select class="select-pill" id="yearSelect" aria-label="Période"><option value="year" selected>Cette année</option><option value="all">Toutes les dates</option></select></div>
          </div>
          <div class="table-responsive"><table class="data-table responsive-table"><thead><tr><th>Workflow</th><th>Étape en cours</th><th class="num">Tentatives</th><th>Démarré</th><th>Terminé</th><th>Statut</th></tr></thead>
            <tbody id="rows"><tr><td colspan="6" class="data-state" role="status">Chargement…</td></tr></tbody></table></div>
          <nav class="pager" id="pager" aria-label="Pagination"></nav>
        </section><section class="card sub-card list-card">
          <div class="card-header"><h2 class="card-title">Règles d'automatisation</h2></div>
          <div class="table-responsive"><table class="data-table responsive-table"><thead><tr><th>Règle</th><th>Déclencheur</th><th>Action</th><th>Statut</th></tr></thead>
            <tbody id="ruleRows"><tr><td colspan="4" class="data-state">Chargement…</td></tr></tbody></table></div>
        </section>
      </main>
    </div>
  </div>
  <script src="js/app_shell.js"></script>
  <script src="js/list_page.js"></script>
  <script src="js/pages/workflows.js"></script>
</body>
</html>
