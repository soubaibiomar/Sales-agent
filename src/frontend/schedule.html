<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selia — Rendez-vous</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/schedule.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar"><div data-app-nav></div></aside>
    <div class="main-wrapper">
      <header class="topbar"></header>
      <main class="content-wrapper" id="main">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Rendez-vous</h1>
            <p>Planifiez et suivez vos rendez-vous avec vos clients.</p>
          </div>
          <div class="page-actions"><button type="button" class="btn btn-primary" id="btnNewAppt" data-icon="plus">Nouveau rendez-vous</button></div>
        </div>

        <section class="kpi-grid kpi-grid--compact" id="kpis" aria-label="Indicateurs"></section>

        <div class="agenda-grid">
          <section class="card calendar-card" aria-label="Calendrier">
            <div class="cal-head">
              <button type="button" class="icon-btn icon-btn--sm" id="prevMonth" aria-label="Mois précédent">‹</button>
              <h2 id="monthTitle"></h2>
              <button type="button" class="icon-btn icon-btn--sm" id="nextMonth" aria-label="Mois suivant">›</button>
            </div>
            <div class="cal-grid cal-dow" aria-hidden="true"><span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span></div>
            <div class="cal-grid" id="calDays" role="grid"></div>
          </section>
          <section class="card day-card" aria-labelledby="dayTitle">
            <div class="card-header"><h2 class="card-title" id="dayTitle"></h2><span class="card-subtitle" id="dayCount"></span></div>
            <ul class="agenda" id="agenda"></ul>
          </section>
        </div>

        <div class="modal-backdrop" id="apptModal" hidden>
          <form class="modal" id="apptForm" novalidate aria-labelledby="apptTitle">
            <h2 id="apptTitle">Nouveau rendez-vous</h2>
            <div class="form-grid">
              <div class="field span-2"><label for="aAccount">Client</label><select class="form-control" id="aAccount"></select></div>
              <div class="field"><label for="aType">Type</label><select class="form-control" id="aType">
                <option value="SALES_DEMO">Réunion commerciale</option><option value="ON_SITE_INSTALLATION">Visite sur site</option>
                <option value="HARDWARE_SUPPORT">Support</option><option value="DELIVERY_SLOT">Livraison</option></select></div>
              <div class="field"><label for="aLoc">Lieu</label><select class="form-control" id="aLoc">
                <option value="VIDEO_CALL">Visioconférence</option><option value="ON_SITE">Sur site</option><option value="PHONE">Téléphone</option></select></div>
              <div class="field"><label for="aDate">Date *</label><input class="form-control" id="aDate" type="date" required></div>
              <div class="field"><label for="aTime">Heure *</label><input class="form-control" id="aTime" type="time" value="10:00" required></div>
              <div class="field"><label for="aDur">Durée</label><select class="form-control" id="aDur"><option value="30">30 min</option><option value="60" selected>1 h</option><option value="90">1 h 30</option><option value="120">2 h</option></select></div>
              <div class="field span-2"><label for="aNotes">Objet</label><input class="form-control" id="aNotes" maxlength="255" placeholder="Présentation du devis, visite site…"></div>
            </div>
            <p class="form-error" id="apptError" role="alert"></p>
            <div class="modal-actions"><button type="button" class="btn btn-outline" data-close-modal>Annuler</button><button type="submit" class="btn btn-primary">Planifier</button></div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="js/app_shell.js"></script>
  <script src="js/list_page.js"></script>
  <script src="js/pages/schedule.js"></script>
</body>
</html>
