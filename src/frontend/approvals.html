<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selia — Approbations</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/approvals.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar"><div data-app-nav></div></aside>
    <div class="main-wrapper">
      <header class="topbar"></header>
      <main class="content-wrapper" id="main">
        <div class="page-header">
          <div class="page-title-group"><h1>Approbations</h1><p>Validez les devis qui dépassent vos seuils de remise ou de marge.</p></div>
        </div>

        <section class="kpi-grid kpi-grid--compact" id="kpis" aria-label="Indicateurs"></section>

        <section class="approval-list" id="approvalList" aria-live="polite"><p class="data-state" role="status">Chargement des demandes…</p></section>

        <div class="modal-backdrop" id="approveModal" hidden>
          <form class="modal" id="approveForm" novalidate aria-labelledby="approveTitle">
            <h2 id="approveTitle">Approuver le devis</h2>
            <p class="cell-sub" id="approveMeta"></p>
            <div class="field"><label for="mfaCode">Code de vérification (application d'authentification)</label>
              <input class="form-control" id="mfaCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div>
            <p class="form-error" role="alert"></p>
            <div class="modal-actions"><button type="button" class="btn btn-outline" data-close-modal>Annuler</button><button type="submit" class="btn btn-primary">Approuver</button></div>
          </form>
        </div>

        <div class="modal-backdrop" id="rejectModal" hidden>
          <form class="modal" id="rejectForm" novalidate aria-labelledby="rejectTitle">
            <h2 id="rejectTitle">Refuser le devis</h2>
            <div class="field"><label for="rejectReason">Motif du refus *</label><textarea class="form-control" id="rejectReason" rows="3" required maxlength="500"></textarea></div>
            <p class="form-error" role="alert"></p>
            <div class="modal-actions"><button type="button" class="btn btn-outline" data-close-modal>Annuler</button><button type="submit" class="btn btn-accent">Refuser</button></div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="js/app_shell.js"></script>
  <script src="js/list_page.js"></script>
  <script src="js/pages/approvals.js"></script>
</body>
</html>
