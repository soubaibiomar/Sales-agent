<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selia — Abonnement & quotas</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/saas_admin_dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar"><div data-app-nav></div></aside>
    <div class="main-wrapper">
      <header class="topbar"></header>
      <main class="content-wrapper" id="main">
        <div class="page-header"><div class="page-title-group"><h1>Abonnement & quotas</h1><p>Votre offre, sa période et la consommation du mois.</p></div><div class="page-actions"><button type="button" class="btn btn-primary" id="btnAdjust" data-icon="settings">Ajuster les quotas</button></div></div>
        <section class="kpi-grid kpi-grid--compact" id="kpis" aria-label="Indicateurs"><p class="data-state" role="status">Chargement…</p></section><section class="card sub-card"><div class="card-header"><h2 class="card-title">Consommation du mois</h2><span class="card-subtitle" id="periodLabel"></span></div><ul class="quota-list" id="quotas"></ul></section><div class="modal-backdrop" id="quotaModal" hidden>
          <form class="modal" id="quotaForm" novalidate aria-labelledby="quotaTitle">
            <h2 id="quotaTitle">Ajuster les quotas</h2>
            <p class="cell-sub">Réservé aux administrateurs, avec vérification en deux étapes active sur la session.</p>
            <div class="form-grid">
              <div class="field"><label for="qTokens">Jetons IA / mois</label><input class="form-control" id="qTokens" type="number" min="100000" step="1000"></div>
              <div class="field"><label for="qVoice">Minutes vocales / mois</label><input class="form-control" id="qVoice" type="number" min="10"></div>
              <div class="field"><label for="qApi">Appels API / mois</label><input class="form-control" id="qApi" type="number" min="1000"></div>
              <div class="field"><label for="qSeats">Utilisateurs (sièges)</label><input class="form-control" id="qSeats" type="number" min="1"></div>
            </div>
            <p class="form-error" role="alert"></p>
            <div class="modal-actions"><button type="button" class="btn btn-outline" data-close-modal>Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button></div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="js/app_shell.js"></script>
  <script src="js/list_page.js"></script>
  <script src="js/pages/saas_admin_dashboard.js"></script>
</body>
</html>
