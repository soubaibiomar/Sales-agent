<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selia — Opportunités</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/pipeline.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar"><div data-app-nav></div></aside>
    <div class="main-wrapper">
      <header class="topbar"></header>
      <main class="content-wrapper" id="main">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Opportunités <span class="count" id="oppCount"></span></h1>
            <p>Suivez l'avancement de vos opportunités commerciales.</p>
          </div>
          <div class="page-actions">
            <div class="segmented" role="group" aria-label="Affichage">
              <button type="button" data-view="board" aria-pressed="true">Pipeline</button>
              <button type="button" data-view="list" aria-pressed="false">Liste</button>
            </div>
            <button type="button" class="btn btn-primary" id="btnNewOpp" data-icon="plus">Nouvelle opportunité</button>
          </div>
        </div>

        <section class="board" id="board" aria-label="Pipeline par étape"><p class="data-state" role="status">Chargement du pipeline…</p></section>

        <section class="card list-card" id="listView" hidden>
          <div class="table-responsive">
            <table class="data-table responsive-table">
              <thead><tr><th>Opportunité</th><th>Client</th><th>Étape</th><th class="num">Montant (MAD)</th><th class="num">Probabilité</th></tr></thead>
              <tbody id="oppRows"></tbody>
            </table>
          </div>
        </section>

        <div class="modal-backdrop" id="oppModal" hidden>
          <form class="modal" id="oppForm" novalidate aria-labelledby="oppModalTitle">
            <h2 id="oppModalTitle">Nouvelle opportunité</h2>
            <div class="form-grid">
              <div class="field span-2"><label for="oTitle">Intitulé *</label><input class="form-control" id="oTitle" required maxlength="255"></div>
              <div class="field span-2"><label for="oAccount">Client *</label><select class="form-control" id="oAccount" required></select></div>
              <div class="field"><label for="oAmount">Montant (MAD)</label><input class="form-control" id="oAmount" type="number" min="0" step="0.01" inputmode="decimal"></div>
              <div class="field"><label for="oStage">Étape</label><select class="form-control" id="oStage">
                <option value="DISCOVERY">Prospection</option><option value="QUALIFICATION">Qualification</option>
                <option value="PROPOSAL">Proposition</option><option value="NEGOTIATION">Négociation</option></select></div>
              <div class="field"><label for="oProb">Probabilité (%)</label><input class="form-control" id="oProb" type="number" min="0" max="100" value="20"></div>
              <div class="field"><label for="oClose">Clôture prévue</label><input class="form-control" id="oClose" type="date"></div>
            </div>
            <p class="form-error" id="oppFormError" role="alert"></p>
            <div class="modal-actions">
              <button type="button" class="btn btn-outline" data-close-modal>Annuler</button>
              <button type="submit" class="btn btn-primary">Créer l'opportunité</button>
            </div>
          </form>
        </div>

        <div class="modal-backdrop" id="dealModal" hidden>
          <form class="modal" id="dealForm" aria-labelledby="dealTitle">
            <h2 id="dealTitle">Opportunité</h2>
            <p class="deal-meta" id="dealMeta"></p>
            <div class="field"><label for="dealStage">Déplacer vers l'étape</label><select class="form-control" id="dealStage">
              <option value="DISCOVERY">Prospection</option><option value="QUALIFICATION">Qualification</option><option value="PROPOSAL">Proposition</option>
              <option value="NEGOTIATION">Négociation</option><option value="CLOSED_WON">Gagnée</option><option value="CLOSED_LOST">Perdue</option></select></div>
            <div class="field" id="lostReasonField" hidden><label for="dealLost">Motif de perte</label><input class="form-control" id="dealLost" maxlength="255"></div>
            <p class="form-error" id="dealError" role="alert"></p>
            <div class="modal-actions">
              <a class="btn btn-outline" id="dealQuote" href="quote_builder.html">Créer un devis</a>
              <button type="submit" class="btn btn-primary">Enregistrer</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="js/app_shell.js"></script>
  <script src="js/pages/pipeline.js"></script>
</body>
</html>
