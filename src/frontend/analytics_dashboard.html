<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selia — Analyses</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/analytics_dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar"><div data-app-nav></div></aside>
    <div class="main-wrapper">
      <header class="topbar"></header>
      <main class="content-wrapper" id="main">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Analyses</h1>
            <p>Suivez la performance commerciale de votre activité.</p>
          </div>
          <div class="page-actions">
            <select class="select-pill" id="rangeSelect" aria-label="Période">
              <option value="year" selected>Cette année</option>
              <option value="365">12 derniers mois</option>
              <option value="90">90 derniers jours</option>
              <option value="30">30 derniers jours</option>
            </select>
          </div>
        </div>

        <section class="kpi-grid" id="kpis" aria-label="Indicateurs clés"></section>

        <div class="ana-grid">
          <section class="card ana-wide">
            <div class="card-header"><h2 class="card-title">Évolution du chiffre d'affaires</h2><span class="card-subtitle">Mensuel, MAD</span></div>
            <div class="chart-box" id="revenueChart"></div>
          </section>
          <section class="card">
            <div class="card-header"><h2 class="card-title">Répartition des ventes</h2><span class="card-subtitle">par client</span></div>
            <div id="salesDonut"></div>
          </section>
          <section class="card">
            <div class="card-header"><h2 class="card-title">Ventes par client</h2></div>
            <ul class="hbars" id="clientBars"></ul>
          </section>
          <section class="card">
            <div class="card-header"><h2 class="card-title">Tendance des indicateurs</h2><span class="card-subtitle" id="trendCaption"></span></div>
            <div class="trend-tiles" id="trends"></div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="js/charts.js"></script>
  <script src="js/app_shell.js"></script>
  <script src="js/pages/analytics_dashboard.js"></script>
</body>
</html>
