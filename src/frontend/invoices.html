<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selia — Factures</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/invoices.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar"><div data-app-nav></div></aside>
    <div class="main-wrapper">
      <header class="topbar"></header>
      <main class="content-wrapper" id="main">
        <div class="page-header">
          <div class="page-title-group"><h1>Factures</h1><p>Suivez la facturation, les échéances et les encaissements.</p></div>
          <div class="page-actions"><button type="button" class="btn btn-primary" id="btnNew" data-icon="plus">Facturer une commande</button></div>
        </div>
        <section class="kpi-grid kpi-grid--compact" id="kpis" aria-label="Indicateurs"></section>
        <section class="card list-card">
          <div class="list-toolbar">
            <div class="chip-row" role="group" aria-label="Filtrer" id="chips"></div>
            <div class="toolbar-right">
              <label class="search-inline"><span class="visually-hidden">Rechercher</span><input type="search" class="form-control" id="search" placeholder="Rechercher une facture, une commande…"></label>
              <select class="select-pill" id="yearSelect" aria-label="Période"><option value="year" selected>Cette année</option><option value="all">Toutes les dates</option></select>
            </div>
          </div>
          <div class="table-responsive">
            <table class="data-table responsive-table">
              <thead><tr><th>N° facture</th><th>Commande</th><th class="num">Montant (MAD)</th><th>Émise le</th><th>Échéance</th><th>Statut</th></tr></thead>
              <tbody id="rows"><tr><td colspan="6" class="data-state" role="status">Chargement…</td></tr></tbody>
            </table>
          </div>
          <nav class="pager" id="pager" aria-label="Pagination"></nav>
        </section>


        <div class="modal-backdrop" id="newModal" hidden>
          <form class="modal" id="newModalForm" novalidate aria-labelledby="newModalTitle">
            <h2 id="newModalTitle">Facturer une commande</h2>
            <div class="form-grid"><div class="field span-2"><label for="fOrder">Commande *</label><select class="form-control" id="fOrder"><option value="">Choisir une commande…</option></select></div><div class="field"><label for="fDue">Échéance (jours)</label><input class="form-control" id="fDue" type="number" min="0" max="365" value="30"></div><div class="field span-2"><label for="fNotes">Notes</label><input class="form-control" id="fNotes" type="text" ></div></div>
            <p class="form-error" role="alert"></p>
            <div class="modal-actions"><button type="button" class="btn btn-outline" data-close-modal>Annuler</button><button type="submit" class="btn btn-primary">Créer la facture</button></div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="js/app_shell.js"></script>
  <script src="js/list_page.js"></script>
  <script src="js/pages/invoices.js"></script>
</body>
</html>
