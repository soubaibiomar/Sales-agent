<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selia — Catalogue produits</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/catalog.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar"><div data-app-nav></div></aside>
    <div class="main-wrapper">
      <header class="topbar"></header>
      <main class="content-wrapper" id="main">
        <div class="page-header">
          <div class="page-title-group"><h1>Catalogue produits</h1><p>Gérez vos produits, prix et taux de TVA.</p></div>
          <div class="page-actions"><button type="button" class="btn btn-primary" id="btnNew" data-icon="plus">Nouveau produit</button></div>
        </div>
        <section class="kpi-grid kpi-grid--compact" id="kpis" aria-label="Indicateurs"></section>
        <section class="card list-card">
          <div class="list-toolbar">
            <div class="chip-row" role="group" aria-label="Filtrer" id="chips"></div>
            <div class="toolbar-right">
              <label class="search-inline"><span class="visually-hidden">Rechercher</span><input type="search" class="form-control" id="search" placeholder="Rechercher un produit, un SKU…"></label>

            </div>
          </div>
          <div class="table-responsive">
            <table class="data-table responsive-table">
              <thead><tr><th>SKU</th><th>Produit</th><th>Catégorie</th><th class="num">Prix HT (MAD)</th><th>TVA</th><th>Statut</th></tr></thead>
              <tbody id="rows"><tr><td colspan="6" class="data-state" role="status">Chargement…</td></tr></tbody>
            </table>
          </div>
          <nav class="pager" id="pager" aria-label="Pagination"></nav>
        </section>


        <div class="modal-backdrop" id="newModal" hidden>
          <form class="modal" id="newModalForm" novalidate aria-labelledby="newModalTitle">
            <h2 id="newModalTitle">Nouveau produit</h2>
            <div class="form-grid"><div class="field"><label for="pSku">SKU *</label><input class="form-control" id="pSku" type="text" maxlength="100" required></div><div class="field"><label for="pName">Nom *</label><input class="form-control" id="pName" type="text" maxlength="255" required></div><div class="field"><label for="pCategory">Catégorie</label><input class="form-control" id="pCategory" type="text" ></div><div class="field"><label for="pUom">Unité</label><select class="form-control" id="pUom"><option value="UNIT">Unité</option><option value="KG">Kilogramme</option><option value="HOUR">Heure</option><option value="M2">m²</option></select></div><div class="field"><label for="pPrice">Prix HT (MAD) *</label><input class="form-control" id="pPrice" type="number" min="0" step="0.01" required></div><div class="field"><label for="pCost">Coût (MAD)</label><input class="form-control" id="pCost" type="number" min="0" step="0.01"></div><div class="field"><label for="pTax">TVA (%)</label><input class="form-control" id="pTax" type="number" min="0" max="100" step="0.01" value="20"></div><div class="field"><label for="pType">Type</label><select class="form-control" id="pType"><option value="PHYSICAL">Produit</option><option value="SERVICE">Service</option></select></div><div class="field span-2"><label for="pDesc">Description</label><textarea class="form-control" id="pDesc" rows="2"></textarea></div></div>
            <p class="form-error" role="alert"></p>
            <div class="modal-actions"><button type="button" class="btn btn-outline" data-close-modal>Annuler</button><button type="submit" class="btn btn-primary">Créer le produit</button></div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="js/app_shell.js"></script>
  <script src="js/list_page.js"></script>
  <script src="js/pages/catalog.js"></script>
</body>
</html>
