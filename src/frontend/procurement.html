<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selia — Achats & fournisseurs</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/procurement.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar"><div data-app-nav></div></aside>
    <div class="main-wrapper">
      <header class="topbar"></header>
      <main class="content-wrapper" id="main">
        <div class="page-header">
          <div class="page-title-group"><h1>Achats & fournisseurs</h1><p>Pilotez vos bons de commande et vos fournisseurs.</p></div>
          <div class="page-actions"><button type="button" class="btn btn-primary" id="btnNew" data-icon="plus">Nouveau fournisseur</button></div>
        </div>
        <section class="kpi-grid kpi-grid--compact" id="kpis" aria-label="Indicateurs"></section>
        <section class="card list-card">
          <div class="list-toolbar">
            <div class="chip-row" role="group" aria-label="Filtrer" id="chips"></div>
            <div class="toolbar-right">
              <label class="search-inline"><span class="visually-hidden">Rechercher</span><input type="search" class="form-control" id="search" placeholder="Rechercher un bon, un fournisseur…"></label>
              <select class="select-pill" id="yearSelect" aria-label="Période"><option value="year" selected>Cette année</option><option value="all">Toutes les dates</option></select>
            </div>
          </div>
          <div class="table-responsive">
            <table class="data-table responsive-table">
              <thead><tr><th>N° bon</th><th>Fournisseur</th><th class="num">Montant (MAD)</th><th>Créé le</th><th>Livraison prévue</th><th>Statut</th></tr></thead>
              <tbody id="rows"><tr><td colspan="6" class="data-state" role="status">Chargement…</td></tr></tbody>
            </table>
          </div>
          <nav class="pager" id="pager" aria-label="Pagination"></nav>
        </section>
        <section class="card sub-card list-card"><div class="card-header"><h2 class="card-title">Fournisseurs</h2></div>
          <div class="table-responsive"><table class="data-table responsive-table"><thead><tr><th>Fournisseur</th><th>Contact</th><th>E-mail</th><th>Téléphone</th><th>Conditions</th></tr></thead>
          <tbody id="supplierRows"><tr><td colspan="5" class="data-state">Chargement…</td></tr></tbody></table></div></section>

        <div class="modal-backdrop" id="newModal" hidden>
          <form class="modal" id="newModalForm" novalidate aria-labelledby="newModalTitle">
            <h2 id="newModalTitle">Nouveau fournisseur</h2>
            <div class="form-grid"><div class="field"><label for="sCode">Code *</label><input class="form-control" id="sCode" type="text" maxlength="64" required></div><div class="field"><label for="sName">Raison sociale *</label><input class="form-control" id="sName" type="text" maxlength="255" required></div><div class="field"><label for="sContact">Contact</label><input class="form-control" id="sContact" type="text" ></div><div class="field"><label for="sPhone">Téléphone</label><input class="form-control" id="sPhone" type="tel" ></div><div class="field span-2"><label for="sEmail">E-mail</label><input class="form-control" id="sEmail" type="email" ></div><div class="field"><label for="sTerms">Conditions de paiement</label><select class="form-control" id="sTerms"><option value="NET_30">30 jours</option><option value="NET_60">60 jours</option><option value="DUE_ON_RECEIPT">À réception</option></select></div></div>
            <p class="form-error" role="alert"></p>
            <div class="modal-actions"><button type="button" class="btn btn-outline" data-close-modal>Annuler</button><button type="submit" class="btn btn-primary">Créer le fournisseur</button></div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="js/app_shell.js"></script>
  <script src="js/list_page.js"></script>
  <script src="js/pages/procurement.js"></script>
</body>
</html>
