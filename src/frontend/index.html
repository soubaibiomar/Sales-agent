<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selia — Tableau de bord</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/index.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar"><div data-app-nav></div></aside>
    <div class="main-wrapper">
      <header class="topbar"></header>
      <main class="content-wrapper" id="main">
        <div class="page-header">
          <div class="page-title-group">
            <h1 id="greetingTitle">Bonjour</h1>
            <p>Voici un aperçu de votre activité commerciale aujourd'hui.</p>
          </div>
          <div class="page-actions">
            <select class="select-pill" id="periodSelect" aria-label="Période des indicateurs">
              <option value="7">7 derniers jours</option>
              <option value="30" selected>30 derniers jours</option>
              <option value="90">90 derniers jours</option>
              <option value="365">12 derniers mois</option>
            </select>
          </div>
        </div>

        <section class="kpi-grid" id="kpis" aria-label="Indicateurs clés"></section>

        <div class="dash-grid">
          <section class="card dash-span">
            <div class="card-header">
              <h2 class="card-title">Évolution du chiffre d'affaires</h2>
              <select class="select-pill" id="granularity" aria-label="Granularité">
                <option value="month" selected>Mensuel</option>
                <option value="week">Hebdomadaire</option>
              </select>
            </div>
            <div class="chart-box" id="revenueChart"></div>
          </section>
          <section class="card">
            <div class="card-header"><h2 class="card-title">Répartition des opportunités</h2></div>
            <div id="oppDonut"></div>
          </section>
          <section class="card dash-span">
            <div class="card-header"><h2 class="card-title">Activités récentes</h2><a class="link-accent" href="orders.html">Voir tout →</a></div>
            <ul class="feed" id="activityFeed"></ul>
          </section>
          <section class="card">
            <div class="card-header"><h2 class="card-title">Top clients</h2><a class="link-accent" href="clients.html">Voir tout →</a></div>
            <ul class="feed" id="topClients"></ul>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="js/charts.js"></script>
  <script src="js/app_shell.js"></script>
  <script src="js/pages/index.js"></script>
</body>
</html>
