<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Selia — Consultation du devis</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/quote_view.css">
</head>
<body class="public-body">
  <header class="public-head">
    <span class="selia-logo"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M25 9.5C22.5 6 17.5 5 13 6.2 8.8 7.3 7.3 10.6 9 13c1.4 2 4.6 2.6 8 3" fill="none" stroke="#D0673A" stroke-width="5.2" stroke-linecap="round"/><path d="M15 16c3.4.4 7 1.6 7.6 4.4.6 2.9-2.8 5.4-8 5.6-3.6.2-6.6-.8-8.2-2.4" fill="none" stroke="#5F7A2E" stroke-width="5.2" stroke-linecap="round"/></svg><span class="selia-wordmark">Selia</span></span>
  </header>
  <main class="public-main" id="main">
    <section class="card quote-doc" id="quoteDoc" aria-live="polite"><p class="data-state" role="status">Chargement du devis…</p></section>
    <section class="card quote-actions" id="quoteActions" hidden>
      <h2 class="card-title">Votre décision</h2>
      <div class="field"><label for="qNote">Message ou nom du signataire (optionnel)</label><input class="form-control" id="qNote" maxlength="255" autocomplete="name"></div>
      <p class="form-error" id="qError" role="alert"></p>
      <div class="modal-actions"><button type="button" class="btn btn-outline" id="qReject">Refuser le devis</button><button type="button" class="btn btn-primary" id="qAccept">Accepter le devis</button></div>
    </section>
  </main>
  <script src="js/pages/quote_view.js"></script>
</body>
</html>
