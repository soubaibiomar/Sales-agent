<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selia — Notifications</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/notifications.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar"><div data-app-nav></div></aside>
    <div class="main-wrapper">
      <header class="topbar"></header>
      <main class="content-wrapper" id="main">
        <div class="page-header">
          <div class="page-title-group"><h1>Notifications</h1><p>Messages envoyés aux clients, modèles et désinscriptions.</p></div>
          <div class="page-actions"><button type="button" class="btn btn-outline" id="btnOptOut" data-icon="user">Désinscrire un destinataire</button><button type="button" class="btn btn-primary" id="btnSend" data-icon="chat">Envoyer une notification</button></div>
        </div>
        <section class="kpi-grid kpi-grid--compact" id="kpis" aria-label="Indicateurs"></section><section class="card list-card">

          <div class="list-toolbar">
            <div class="chip-row" role="group" aria-label="Filtrer" id="chips"></div>
            <div class="toolbar-right"><label class="search-inline"><span class="visually-hidden">Rechercher</span><input type="search" class="form-control" id="search" placeholder="Rechercher un destinataire, un sujet…"></label><select class="select-pill" id="yearSelect" aria-label="Période"><option value="year" selected>Cette année</option><option value="all">Toutes les dates</option></select></div>
          </div>
          <div class="table-responsive"><table class="data-table responsive-table"><thead><tr><th>Destinataire</th><th>Canal</th><th>Type</th><th>Sujet</th><th>Date</th><th>Statut</th></tr></thead>
            <tbody id="rows"><tr><td colspan="6" class="data-state" role="status">Chargement…</td></tr></tbody></table></div>
          <nav class="pager" id="pager" aria-label="Pagination"></nav>
        </section><section class="card sub-card list-card">
          <div class="card-header"><h2 class="card-title">Modèles</h2></div>
          <div class="table-responsive"><table class="data-table responsive-table"><thead><tr><th>Code</th><th>Canal</th><th>Type</th><th>Langue</th><th>Statut</th></tr></thead>
            <tbody id="templateRows"><tr><td colspan="5" class="data-state">Chargement…</td></tr></tbody></table></div>
        </section><div class="modal-backdrop" id="sendModal" hidden>
          <form class="modal" id="sendModalForm" novalidate aria-labelledby="sendModalTitle">
            <h2 id="sendModalTitle">Envoyer une notification</h2>
            <div class="form-grid"><div class="field"><label for="nTo">Destinataire *</label><input class="form-control" id="nTo" type="text" required maxlength="255" placeholder="+212… ou e-mail"></div><div class="field"><label for="nChannel">Canal</label><select class="form-control" id="nChannel"><option value="WHATSAPP">WhatsApp</option><option value="EMAIL">E-mail</option><option value="SMS">SMS</option></select></div><div class="field span-2"><label for="nSubject">Sujet</label><input class="form-control" id="nSubject" type="text" maxlength="255"></div><div class="field span-2"><label for="nContent">Message *</label><textarea class="form-control" id="nContent" rows="4" required></textarea></div></div>
            <p class="form-error" role="alert"></p>
            <div class="modal-actions"><button type="button" class="btn btn-outline" data-close-modal>Annuler</button><button type="submit" class="btn btn-primary">Envoyer</button></div>
          </form>
        </div><div class="modal-backdrop" id="optModal" hidden>
          <form class="modal" id="optModalForm" novalidate aria-labelledby="optModalTitle">
            <h2 id="optModalTitle">Désinscrire un destinataire</h2>
            <div class="form-grid"><div class="field"><label for="oTo">Destinataire *</label><input class="form-control" id="oTo" type="text" required maxlength="255"></div><div class="field"><label for="oChannel">Canal</label><select class="form-control" id="oChannel"><option value="WHATSAPP">WhatsApp</option><option value="EMAIL">E-mail</option><option value="SMS">SMS</option></select></div></div>
            <p class="form-error" role="alert"></p>
            <div class="modal-actions"><button type="button" class="btn btn-outline" data-close-modal>Annuler</button><button type="submit" class="btn btn-primary">Désinscrire</button></div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="js/app_shell.js"></script>
  <script src="js/list_page.js"></script>
  <script src="js/pages/notifications.js"></script>
</body>
</html>
