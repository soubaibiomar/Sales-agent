<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="js/api_client.js"></script>
  <script src="js/data_views.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selia — Fiabilité & alertes</title>
  <link rel="stylesheet" href="css/design_system.css">
  <link rel="stylesheet" href="css/pages/workflow_reliability_dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar"><div data-app-nav></div></aside>
    <div class="main-wrapper">
      <header class="topbar"></header>
      <main class="content-wrapper" id="main">
        <div class="page-header"><div class="page-title-group"><h1>Fiabilité & alertes</h1><p>Disponibilité des dépendances, alertes et traces récentes.</p></div><div class="page-actions"><button type="button" class="btn btn-outline" id="btnRefresh" data-icon="arrow">Actualiser</button></div></div>
        <section class="kpi-grid kpi-grid--compact" id="kpis" aria-label="Indicateurs"><p class="data-state" role="status">Chargement…</p></section><section class="card sub-card"><div class="card-header"><h2 class="card-title">Dépendances</h2><span class="card-subtitle" id="checkedAt"></span></div><div class="dep-grid" id="deps"></div></section><section class="card list-card sub-card"><div class="card-header"><h2 class="card-title">Alertes</h2></div>
          <div class="table-responsive"><table class="data-table responsive-table"><thead><tr><th>Alerte</th><th>Source</th><th>Gravité</th><th>Depuis</th><th>Statut</th><th></th></tr></thead>
          <tbody id="alertRows"><tr><td colspan="6" class="data-state">Chargement…</td></tr></tbody></table></div></section><section class="card list-card sub-card"><div class="card-header"><h2 class="card-title">Traces récentes</h2></div>
          <div class="table-responsive"><table class="data-table responsive-table"><thead><tr><th>Opération</th><th>Composant</th><th class="num">Durée</th><th>Statut</th><th>Quand</th></tr></thead>
          <tbody id="traceRows"><tr><td colspan="5" class="data-state">Chargement…</td></tr></tbody></table></div></section>
      </main>
    </div>
  </div>
  <script src="js/app_shell.js"></script>
  <script src="js/pages/workflow_reliability_dashboard.js"></script>
</body>
</html>
