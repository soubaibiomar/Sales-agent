# CI/CD with security gates (inspection findings F-25 / F-26; controls 37, 38, 60-62).
# Gates: tests on PostgreSQL built by the migration runner, SCA, SAST, secret scan,
# container build + vulnerability scan + SBOM; on main the image is pushed to GHCR and
# signed keylessly with cosign (Sigstore OIDC), so deployments can verify provenance and
# roll back by digest. Third-party actions are pinned by major tag here; pin them to
# commit SHAs in the repository settings policy for production.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sales-ai-platform

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sales_ai_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sales_ai_db" --health-interval 5s --health-retries 10
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - name: Migrate (release step, versioned + checksummed)
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/sales_ai_db
          APP_DB_PASSWORD: ${{ secrets.CI_APP_DB_PASSWORD }}
        run: |
          python -m src.backend.migrations.runner
          python -m src.backend.migrations.runner --status
      - name: Tests (model-dependent tests need Ollama and are expected to fail closed without it)
        run: python -m pytest tests -p no:cacheprovider -q

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Dependency vulnerabilities (SCA)
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Static analysis (SAST)
        run: pip install bandit && bandit -q -r src -ll
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deployment manifests are valid and fail closed without secrets
        run: |
          sed 's/=$/=ci_placeholder_value_0123456789abcdef/' infra/stack.env.example > /tmp/stack.env
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.stack.yml --env-file /tmp/stack.env config --quiet
          sed -i '/^JWT_SECRET_KEY=/d' /tmp/stack.env
          ! docker compose -f infra/docker-compose.yml -f infra/docker-compose.stack.yml --env-file /tmp/stack.env config --quiet

  image:
    needs: [test, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write     # push to GHCR (main only)
      id-token: write     # keyless cosign signing (main only)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Vulnerability scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
      - name: Push to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE}:${GITHUB_SHA}"
          echo "DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      - name: Sign image and attach SBOM attestation (keyless)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cosign sign --yes "${DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${DIGEST}"
