# Prometheus scrape configuration (inspection finding F-26). The API exposes /metrics
# only with the operator bearer token; the proxy blocks /metrics from the outside.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sales-ai-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["sales-ai-api:8000"]
